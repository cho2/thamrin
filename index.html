<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thamrin</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
        }
        /* Custom scrollbar for better dark mode look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-[100rem] w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- CCTV Icon -->
                <div class="p-2 bg-blue-500/20 text-blue-400 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </div>
                <h1 class="text-xl md:text-2xl font-bold text-white tracking-tight">Thamrin</h1>
            </div>
        </div>
    </header>

    <!-- Main Content (Grid Layout) -->
    <main class="flex-grow max-w-[100rem] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- Grid: 1 col on mobile, 3 on tablet (md), 5 on large desktop (xl) -->
        <div id="cctv-grid" class="grid grid-cols-1 md:grid-cols-3 xl:grid-cols-5 gap-4">
            <!-- CCTV Cards akan dimuat secara dinamis via JavaScript di sini -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 mt-auto">
        <div class="max-w-[100rem] w-full mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-sm text-slate-400">
                Sumber CCTV: 
                <a href="https://jakcctv.jakarta.go.id/publik" target="_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 transition-colors underline underline-offset-2">
                    https://jakcctv.jakarta.go.id/publik
                </a>
            </p>
        </div>
    </footer>

    <!-- Script to render iFrame feeds -->
    <script>
        const gridContainer = document.getElementById('cctv-grid');
        
        // Daftar feed CCTV
        const cctvFeeds = [
            { url: "https://dki-jkt.balitower.co.id:7028/504866_JKP_POLRI_UOB-PLAZA-C01_CCTV-01/embed.html", name: "UOB Plaza C01 - 01" },
            { url: "https://dki-jkt.balitower.co.id:7028/504866_JKP_POLRI_UOB-PLAZA-C01_CCTV-02/embed.html", name: "UOB Plaza C01 - 02" },
            { url: "https://dki-jkt.balitower.co.id:7028/504866_JKP_POLRI_UOB-PLAZA-C01_CCTV-03/embed.html", name: "UOB Plaza C01 - 03" },
            { url: "https://dki-jkt.balitower.co.id:7028/501844_JKP_DISHUB_JL.-MH.-THAMRIN-C01_CCTV-01/embed.html", name: "Dishub Thamrin C01 - 01" },
            { url: "https://dki-jkt.balitower.co.id:7028/501844_JKP_DISHUB_JL.-MH.-THAMRIN-C01_CCTV-02/embed.html", name: "Dishub Thamrin C01 - 02" },
            { url: "https://dki-jkt.balitower.co.id:7028/501941_JKP_SATPOLPP_JL.-MH.-THAMRIN-C02_CCTV-01/embed.html", name: "Satpol PP Thamrin C02 - 01" },
            { url: "https://dki-jkt.balitower.co.id:7028/501941_JKP_SATPOLPP_JL.-MH.-THAMRIN-C02_CCTV-02/embed.html", name: "Satpol PP Thamrin C02 - 02" },
            { url: "https://dki-jkt.balitower.co.id:7028/502491_JKP_SATPOL-PP_SIMPANG-JL.-MH.-THAMRIN-C07_CCTV-01/embed.html", name: "Simpang Thamrin C07 - 01" },
            { url: "https://dki-jkt.balitower.co.id:7028/502491_JKP_SATPOL-PP_SIMPANG-JL.-MH.-THAMRIN-C07_CCTV-01/embed.html", name: "Simpang Thamrin C07 - 02" },
            { url: "https://dki-jkt.balitower.co.id:7028/502492_JKP_SATPOL-PP_SIMPANG-JL.-MH.-THAMRIN-C08_CCTV-01/embed.html", name: "Simpang Thamrin C08 - 01" },
            { url: "https://dki-jkt.balitower.co.id:7028/502492_JKP_SATPOL-PP_SIMPANG-JL.-MH.-THAMRIN-C08_CCTV-02/embed.html", name: "Simpang Thamrin C08 - 02" },
            { url: "https://dki-jkt.balitower.co.id:7028/502493_JKP_SATPOL-PP_SIMPANG-JL.-MH.-THAMRIN-C09_CCTV-01/embed.html", name: "Simpang Thamrin C09 - 01" },
            { url: "https://dki-jkt.balitower.co.id:7028/502493_JKP_SATPOL-PP_SIMPANG-JL.-MH.-THAMRIN-C09_CCTV-02/embed.html", name: "Simpang Thamrin C09 - 02" }
        ];

        let cardsHtml = '';
        cctvFeeds.forEach((feed, index) => {
            cardsHtml += `
                <div class="bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700 flex flex-col group hover:border-slate-500 transition-colors duration-300">
                    <div class="relative w-full aspect-video bg-black">
                        <!-- Mengganti tag video menjadi iframe -->
                        <iframe 
                            class="w-full h-full border-0" 
                            src="${feed.url}" 
                            loading="lazy" 
                            allowfullscreen 
                            referrerpolicy="no-referrer">
                        </iframe>
                        
                        <!-- Overlay gradient dan badge -->
                        <div class="absolute inset-0 pointer-events-none bg-gradient-to-t from-black/50 via-transparent to-transparent"></div>
                        
                    </div>
                    <div class="p-3 flex-grow flex flex-col justify-center">
                        <h3 class="font-semibold text-slate-100 text-sm truncate" title="${feed.name}">${feed.name}</h3>
                    </div>
                </div>
            `;
        });
        
        gridContainer.innerHTML = cardsHtml;
    </script>
</body>
</html>
